# Local Supabase stack config (Supabase CLI). `supabase start` reads this to
# boot Postgres + Auth + Studio in Docker on your machine, and applies the
# files in supabase/migrations/ in order. No cloud project, no cost.

project_id = "coach-ai"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323
# Studio UI: http://localhost:54323 — browse tables, run SQL, view auth users.

[auth]
enabled = true
# The site URL the auth service builds links against (the web app in dev).
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Off in local dev so signUp returns a session immediately — otherwise the
# club-creation step waits on a confirmation email you can't receive locally.
# Turn this back on for the cloud project before any real pilot.
enable_confirmations = false

[analytics]
enabled = false
